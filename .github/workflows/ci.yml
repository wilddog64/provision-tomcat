name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles

jobs:
  validation:
    name: Validation
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Debug Runner Environment
        run: |
          whoami
          pwd
          ls -la /Users/
          ls -la /Users/cliang/ || echo "Cannot access /Users/cliang"

      - name: Checkout provision-tomcat
        uses: actions/checkout@v4

      - name: Disable Credential Helper
        run: git config --global credential.helper ""

      - name: Checkout All Roles
        run: |
          rm -rf roles
          mkdir -p roles
          # Symlink from known local dev paths
          ln -sfn /Users/cliang/src/gitrepo/personal/ansible/provision-java roles/provision-java
          ln -sfn /Users/cliang/src/gitrepo/personal/ansible/windows-base roles/windows-base
          ln -sfn /Users/cliang/src/gitrepo/personal/ansible/provision-windows-security roles/provision-windows-security
          # Symlink self as role
          ln -sfn .. roles/provision-tomcat

      - name: Verify Python Environment
        run: |
          python3 --version
          which python3

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
          python3 -m pip install ansible-lint

      - name: Install Ansible collections
        run: |
          source venv/bin/activate
          make deps

      - name: Run Validation
        run: |
          source venv/bin/activate
          make check

  integration:
    name: Integration Tests (Azure or Vagrant)
    runs-on: [self-hosted, macOS, ARM64]
    needs: validation
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (github.head_ref == 'azure-dev' || github.head_ref == 'vagrant-dev'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Azure Availability
        id: azure_check
        run: |
          if az account show > /dev/null 2>&1; then
            echo "AZURE_AVAILABLE=true" >> $GITHUB_ENV
            echo "SESSION_MODE=true" >> $GITHUB_ENV

            # Resolve metadata explicitly
            SUB_ID=$(az account show --query id -o tsv)
            RG_NAME=$(az group list --query "[?contains(name, 'sandbox')].name" -o tsv | head -n 1)

            echo "AZURE_SUBSCRIPTION_ID=$SUB_ID" >> $GITHUB_ENV
            az account set --subscription "$SUB_ID"

            if [ -n "$RG_NAME" ]; then
              echo "AZURE_RESOURCE_GROUP=$RG_NAME" >> $GITHUB_ENV
              echo "Azure session detected. Sub: $SUB_ID, RG: $RG_NAME"
            else
              # Fallback RG name if sandbox cannot be listed
              echo "AZURE_RESOURCE_GROUP=kqvm-win11-rg" >> $GITHUB_ENV
              echo "Azure session detected. Sub: $SUB_ID, RG fallback used: kqvm-win11-rg"
            fi
          elif [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "AZURE_AVAILABLE=true" >> $GITHUB_ENV
            echo "SESSION_MODE=false" >> $GITHUB_ENV
            echo "Azure secrets detected."
          else
            echo "AZURE_AVAILABLE=false" >> $GITHUB_ENV
            echo "No Azure session or secrets found."
          fi

      - name: Checkout All Roles
        run: |
          rm -rf roles
          mkdir -p roles
          # Symlink from known local dev paths
          ln -sfn /Users/cliang/src/gitrepo/personal/ansible/provision-java roles/provision-java
          ln -sfn /Users/cliang/src/gitrepo/personal/ansible/windows-base roles/windows-base
          ln -sfn /Users/cliang/src/gitrepo/personal/ansible/provision-windows-security roles/provision-windows-security

      - name: Symlink current role
        run: |
          mkdir -p roles
          ln -sfn .. roles/provision-tomcat

      - name: Install Ansible collections
        run: |
          python3 -m venv venv
          source venv/bin/activate
          make deps

      - name: Install Ruby Dependencies
        run: |
          source venv/bin/activate
          echo "Checking for rbenv..."
          if [ -d "$HOME/.rbenv" ]; then
            RBENV_ROOT="$HOME/.rbenv"
          elif [ -d "/usr/local/var/rbenv" ]; then
            RBENV_ROOT="/usr/local/var/rbenv"
          elif [ -d "/opt/homebrew/var/rbenv" ]; then
            RBENV_ROOT="/opt/homebrew/var/rbenv"
          fi

          if [ -n "$RBENV_ROOT" ]; then
            echo "Found rbenv at $RBENV_ROOT"
            export PATH="$RBENV_ROOT/shims:$RBENV_ROOT/bin:$PATH"
            export RBENV_SHELL=bash
            bundle -v || gem install bundler
            bundle install
          else
            echo "rbenv not found, trying system ruby/bundle"
            bundle install || gem install bundler && bundle install
          fi

      - name: Login to Azure
        if: env.AZURE_AVAILABLE == 'true' && env.SESSION_MODE == 'false'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Azure Test
        if: env.AZURE_AVAILABLE == 'true'
        run: |
          source venv/bin/activate
          make test-azure-provision-tomcat

      - name: Pre-download Vagrant Box
        if: env.AZURE_AVAILABLE == 'false'
        run: |
          source venv/bin/activate
          ./bin/vagrant-wrapper box add --provider virtualbox --force gusztavvargadr/windows-11-22h2-pro-arm64 || true

      - name: Fallback to Vagrant Test
        if: env.AZURE_AVAILABLE == 'false' && false
        run: |
          source venv/bin/activate
          make test-provision-tomcat

  aws_integration:
    name: AWS Integration Tests
    runs-on: ubuntu-latest
    needs: validation
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'aws-dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AWS Test
        run: echo "AWS tests not yet implemented"
