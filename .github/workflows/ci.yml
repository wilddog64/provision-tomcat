name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout provision-tomcat
        uses: actions/checkout@v4
        with:
          path: provision-tomcat

      - name: Checkout provision-java
        uses: actions/checkout@v4
        with:
          repository: wilddog64/provision-java
          path: provision-tomcat/roles/provision-java
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Install SSH Keys and Config
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WINDOWS_BASE_SSH_KEY }}" > ~/.ssh/id_windows_base
          chmod 600 ~/.ssh/id_windows_base
          echo "${{ secrets.PROVISION_SECURITY_SSH_KEY }}" > ~/.ssh/id_provision_security
          chmod 600 ~/.ssh/id_provision_security
          cat <<EOF > ~/.ssh/config
          Host windows-base-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_windows_base
            IdentitiesOnly yes
          Host provision-security-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_provision_security
            IdentitiesOnly yes
          EOF
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh

      - name: Checkout windows-base
        run: git clone windows-base-repo:wilddog64/windows-base.git provision-tomcat/roles/windows-base

      - name: Checkout provision-windows-security
        run: git clone provision-security-repo:wilddog64/provision-windows-security.git provision-tomcat/roles/provision-windows-security

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f provision-tomcat/requirements.txt ]; then pip install -r provision-tomcat/requirements.txt; fi
          pip install ansible-lint

      - name: Install Ansible collections
        run: make -C provision-tomcat deps

      - name: Run Validation
        run: make -C provision-tomcat check

  integration:
    name: Integration Tests (Azure or Vagrant)
    runs-on: [self-hosted, macOS, m2-air]
    needs: validation
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.head_ref == 'azure-dev' || github.head_ref == 'vagrant-dev'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Azure Availability
        id: azure_check
        run: |
          if az account show > /dev/null 2>&1; then
            echo "AZURE_AVAILABLE=true" >> $GITHUB_ENV
            echo "SESSION_MODE=true" >> $GITHUB_ENV

            # Resolve metadata explicitly
            SUB_ID=$(az account show --query id -o tsv)
            RG_NAME=$(az group list --query "[?contains(name, 'sandbox')].name" -o tsv | head -n 1)

            echo "AZURE_SUBSCRIPTION_ID=$SUB_ID" >> $GITHUB_ENV
            az account set --subscription "$SUB_ID"

            if [ -n "$RG_NAME" ]; then
              echo "AZURE_RESOURCE_GROUP=$RG_NAME" >> $GITHUB_ENV
              echo "Azure session detected. Sub: $SUB_ID, RG: $RG_NAME"
            else
              # Fallback RG name if sandbox cannot be listed
              echo "AZURE_RESOURCE_GROUP=kqvm-win11-rg" >> $GITHUB_ENV
              echo "Azure session detected. Sub: $SUB_ID, RG fallback used: kqvm-win11-rg"
            fi
          elif [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "AZURE_AVAILABLE=true" >> $GITHUB_ENV
            echo "SESSION_MODE=false" >> $GITHUB_ENV
            echo "Azure secrets detected."
          else
            echo "AZURE_AVAILABLE=false" >> $GITHUB_ENV
            echo "No Azure session or secrets found."
          fi

      - name: Checkout provision-java
        uses: actions/checkout@v4
        with:
          repository: wilddog64/provision-java
          path: roles/provision-java
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Install SSH Keys and Config
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WINDOWS_BASE_SSH_KEY }}" > ~/.ssh/id_windows_base
          chmod 600 ~/.ssh/id_windows_base
          echo "${{ secrets.PROVISION_SECURITY_SSH_KEY }}" > ~/.ssh/id_provision_security
          chmod 600 ~/.ssh/id_provision_security
          cat <<EOF > ~/.ssh/config
          Host windows-base-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_windows_base
            IdentitiesOnly yes
          Host provision-security-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_provision_security
            IdentitiesOnly yes
          EOF
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh

      - name: Checkout windows-base
        run: git clone windows-base-repo:wilddog64/windows-base.git roles/windows-base

      - name: Checkout provision-windows-security
        run: git clone provision-security-repo:wilddog64/provision-windows-security.git roles/provision-windows-security

      - name: Symlink current role
        run: |
          mkdir -p roles
          ln -sfn .. roles/provision-tomcat

      - name: Install Ansible collections
        run: make deps

      - name: Install Ruby Dependencies
        run: |
          echo "Checking for rbenv..."
          if [ -d "$HOME/.rbenv" ]; then
            RBENV_ROOT="$HOME/.rbenv"
          elif [ -d "/usr/local/var/rbenv" ]; then
            RBENV_ROOT="/usr/local/var/rbenv"
          elif [ -d "/opt/homebrew/var/rbenv" ]; then
            RBENV_ROOT="/opt/homebrew/var/rbenv"
          fi

          if [ -n "$RBENV_ROOT" ]; then
            echo "Found rbenv at $RBENV_ROOT"
            export PATH="$RBENV_ROOT/shims:$RBENV_ROOT/bin:$PATH"
            export RBENV_SHELL=bash
            bundle -v || gem install bundler
            bundle install
          else
            echo "rbenv not found, trying system ruby/bundle"
            bundle install || gem install bundler && bundle install
          fi

      - name: Login to Azure
        if: env.AZURE_AVAILABLE == 'true' && env.SESSION_MODE == 'false'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Azure Test
        if: env.AZURE_AVAILABLE == 'true'
        run: make test-azure-provision-tomcat

      - name: Pre-download Vagrant Box
        if: env.AZURE_AVAILABLE == 'false'
        run: ./bin/vagrant-wrapper box add --provider virtualbox --force gusztavvargadr/windows-11-22h2-pro-arm64 || true

      - name: Fallback to Vagrant Test
        if: env.AZURE_AVAILABLE == 'false' && false
        run: make test-provision-tomcat

  aws_integration:
    name: AWS Integration Tests
    runs-on: ubuntu-latest
    needs: validation
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'aws-dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AWS Test
        run: echo "AWS tests not yet implemented"