jobs:
  lint:
    name: Validation
    # Security: Only run on push, manual dispatch, or PRs from same repo (not forks)
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout provision-tomcat
        uses: actions/checkout@v4

      - name: Checkout provision-java
        uses: actions/checkout@v4
        with:
          repository: wilddog64/provision-java
          path: roles/provision-java

      - name: Install SSH Keys and Config
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.WINDOWS_BASE_DEPLOY_KEY }}" > ~/.ssh/id_windows_base
          chmod 600 ~/.ssh/id_windows_base

          echo "${{ secrets.PROVISION_WINDOWS_SECURITY_DEPLOY_KEY }}" > ~/.ssh/id_provision_security
          chmod 600 ~/.ssh/id_provision_security

          cat <<EOF > ~/.ssh/config
          Host windows-base-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_windows_base
            IdentitiesOnly yes

          Host provision-security-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_provision_security
            IdentitiesOnly yes
          EOF

          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh

      - name: Checkout windows-base
        run: git clone windows-base-repo:wilddog64/windows-base.git roles/windows-base

      - name: Checkout provision-windows-security
        run: git clone provision-security-repo:wilddog64/provision-windows-security.git roles/provision-windows-security

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ansible-lint

      - name: Install Ansible collections
        run: make deps

      - name: Link self as role
        run: ln -s . roles/provision-tomcat

      - name: Run Validation
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        run: make check

