  integration-test:
    name: Integration Tests (Azure or Vagrant)
    needs: lint
    if: contains(github.ref, 'azure-dev') || contains(github.base_ref, 'azure-dev') || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    env:
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
      AZURE_AVAILABLE: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ruby Dependencies
        run: |
          echo "Checking for rbenv..."
          if [ -d "$HOME/.rbenv" ]; then
            RBENV_ROOT="$HOME/.rbenv"
          elif [ -d "/usr/local/var/rbenv" ]; then
            RBENV_ROOT="/usr/local/var/rbenv"
          elif [ -d "/opt/homebrew/var/rbenv" ]; then
            RBENV_ROOT="/opt/homebrew/var/rbenv"
          fi

          if [ -n "$RBENV_ROOT" ]; then
            echo "Found rbenv at $RBENV_ROOT"
            export PATH="$RBENV_ROOT/shims:$RBENV_ROOT/bin:$PATH"
            export RBENV_SHELL=bash
            bundle -v || gem install bundler
            bundle install
          else
            echo "rbenv not found, trying system ruby/bundle"
            bundle install || gem install bundler && bundle install
          fi

      - name: Login to Azure
        if: env.AZURE_AVAILABLE == 'true'
        run: |
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} \
            -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}

      - name: Run Azure Test
        if: env.AZURE_AVAILABLE == 'true'
        run: make test-azure-provision-tomcat
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Fallback to Vagrant Test
        if: env.AZURE_AVAILABLE != 'true'
        run: |
          echo "WARNING: Azure credentials not found. Falling back to Vagrant (win11) integration test."
          make vbox-cleanup-disks || true
          bundle exec make test-win11
        env:
          OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES
          VAGRANT_IGNORE_WINRM_PLUGIN: YES

  aws-test:
    name: AWS Integration Tests
    needs: lint
    if: contains(github.ref, 'aws-dev') || contains(github.base_ref, 'aws-dev')
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Run AWS Test
        run: make test-aws-provision-tomcat
