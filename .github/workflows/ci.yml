name: CI

on:
  push:
    branches: [main, azure-dev, aws-dev, vagrant-dev]
  pull_request:
    branches: [main, azure-dev, aws-dev, vagrant-dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles

jobs:
  validation:
    name: Validation
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Debug Runner Environment
        run: |
          whoami
          pwd

      - name: Checkout provision-tomcat
        uses: actions/checkout@v4

      - name: Checkout provision-java
        uses: actions/checkout@v4
        with:
          repository: wilddog64/provision-java
          path: roles/provision-java
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout windows-base
        uses: actions/checkout@v4
        with:
          repository: wilddog64/windows-base
          path: roles/windows-base
          ssh-key: ${{ secrets.WINDOWS_BASE_DEPLOY_KEY }}

      - name: Checkout provision-windows-security
        uses: actions/checkout@v4
        with:
          repository: wilddog64/provision-windows-security
          path: roles/provision-windows-security
          ssh-key: ${{ secrets.PROVISION_WINDOWS_SECURITY_DEPLOY_KEY }}

      - name: Symlink self as role
        run: |
          mkdir -p roles
          ln -sfn .. roles/provision-tomcat

      - name: Verify Python Environment
        run: |
          python3 --version
          which python3

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          # Use stable ansible-core version
          pip install "ansible-core>=2.15.0,<2.16.0" pywinrm
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
          python3 -m pip install ansible-lint

      - name: Install Ansible collections
        run: |
          source venv/bin/activate
          make deps

      - name: Run Validation
        run: |
          source venv/bin/activate
          make check

  aws_integration:
    name: AWS Integration Tests
    runs-on: [self-hosted, macOS, ARM64]
    needs: validation
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'aws-dev') ||
      (github.event_name == 'pull_request' && github.head_ref == 'aws-dev')
    steps:
      - name: Checkout provision-tomcat
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        id: aws_creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Detect AWS Availability
        id: aws_check
        run: |
          # Ensure we look in the real home directory for credentials
          export HOME=/Users/cliang
          if aws sts get-caller-identity > /dev/null 2>&1; then
            echo "AWS_AVAILABLE=true" >> $GITHUB_ENV
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            echo "AWS session detected. Account: $ACCOUNT_ID"
          else
            echo "AWS_AVAILABLE=false" >> $GITHUB_ENV
            echo "No AWS session found. (HOME: $HOME)"
          fi

      - name: Checkout provision-java
        uses: actions/checkout@v4
        with:
          repository: wilddog64/provision-java
          path: roles/provision-java
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout windows-base
        uses: actions/checkout@v4
        with:
          repository: wilddog64/windows-base
          path: roles/windows-base
          ssh-key: ${{ secrets.WINDOWS_BASE_DEPLOY_KEY }}

      - name: Checkout provision-windows-security
        uses: actions/checkout@v4
        with:
          repository: wilddog64/provision-windows-security
          path: roles/provision-windows-security
          ssh-key: ${{ secrets.PROVISION_WINDOWS_SECURITY_DEPLOY_KEY }}

      - name: Symlink self as role
        run: |
          mkdir -p roles
          ln -sfn .. roles/provision-tomcat

      - name: Install Ansible collections
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          # Use stable ansible-core version
          pip install "ansible-core>=2.15.0,<2.16.0" pywinrm
          make deps

      - name: Install Ruby Dependencies
        run: |
          source venv/bin/activate
          echo "Checking for rbenv..."
          if [ -d "$HOME/.rbenv" ]; then
            RBENV_ROOT="$HOME/.rbenv"
          elif [ -d "/usr/local/var/rbenv" ]; then
            RBENV_ROOT="/usr/local/var/rbenv"
          elif [ -d "/opt/homebrew/var/rbenv" ]; then
            RBENV_ROOT="/opt/homebrew/var/rbenv"
          fi

          if [ -n "$RBENV_ROOT" ]; then
            echo "Found rbenv at $RBENV_ROOT"
            export PATH="$RBENV_ROOT/shims:$RBENV_ROOT/bin:$PATH"
            export RBENV_SHELL=bash
            bundle -v || gem install bundler
            bundle install
          else
            echo "rbenv not found, trying system ruby/bundle"
            bundle install || gem install bundler && bundle install
          fi

      - name: Run AWS Test
        if: env.AWS_AVAILABLE == 'true'
        env:
          OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
          HOME: /Users/cliang
        run: |
          source venv/bin/activate
          ansible --version
          make test-aws-provision-tomcat

  azure_integration:
    name: Azure Integration Tests
    runs-on: [self-hosted, macOS, ARM64]
    needs: validation
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'azure-dev') ||
      (github.event_name == 'pull_request' && github.head_ref == 'azure-dev')
    steps:
      - name: Checkout provision-tomcat
        uses: actions/checkout@v4

      - name: Detect Azure Availability
        run: |
          if az account show > /dev/null 2>&1; then
            echo "AZURE_AVAILABLE=true" >> $GITHUB_ENV
            echo "Azure session detected."
          else
            echo "AZURE_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Checkout provision-java
        uses: actions/checkout@v4
        with:
          repository: wilddog64/provision-java
          path: roles/provision-java
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout windows-base
        uses: actions/checkout@v4
        with:
          repository: wilddog64/windows-base
          path: roles/windows-base
          ssh-key: ${{ secrets.WINDOWS_BASE_DEPLOY_KEY }}

      - name: Checkout provision-windows-security
        uses: actions/checkout@v4
        with:
          repository: wilddog64/provision-windows-security
          path: roles/provision-windows-security
          ssh-key: ${{ secrets.PROVISION_WINDOWS_SECURITY_DEPLOY_KEY }}

      - name: Symlink self as role
        run: |
          mkdir -p roles
          ln -sfn .. roles/provision-tomcat

      - name: Run Azure Test
        if: env.AZURE_AVAILABLE == 'true'
        run: make test-azure-provision-tomcat

  vagrant_integration:
    name: Vagrant Integration Tests
    runs-on: [self-hosted, macOS, ARM64]
    needs: validation
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'vagrant-dev') ||
      (github.event_name == 'pull_request' && github.head_ref == 'vagrant-dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Vagrant Test
        run: |
          # Disabled due to instability on Apple Silicon
          echo "Vagrant tests are currently disabled on Apple Silicon runners."
          exit 0