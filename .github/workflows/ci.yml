name: CI

on:
  push:
    branches: [main, azure-dev, aws-dev, vagrant-dev]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.sh'
      - '**.py'
      - '**.rb'
      - 'Makefile'
      - 'Gemfile'
      - 'requirements.txt'
      - 'requirements.yml'
      - 'Vagrantfile*'
      - 'tasks/**'
      - 'defaults/**'
      - 'vars/**'
      - 'roles/**'
      - 'tests/**'
      - '!docs/**'
      - '!memory-bank/**'
  pull_request:
    branches: [main, azure-dev, aws-dev, vagrant-dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.sh'
      - '**.py'
      - '**.rb'
      - 'Makefile'
      - 'Gemfile'
      - 'requirements.txt'
      - 'requirements.yml'
      - 'Vagrantfile*'
      - 'tasks/**'
      - 'defaults/**'
      - 'vars/**'
      - 'roles/**'
      - 'tests/**'
      - '!docs/**'
      - '!memory-bank/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Integration environment to run (optional)'
        required: false
        default: 'vagrant'
        type: choice
        options:
          - vagrant
          - aws
          - azure

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles

jobs:
  lint:
    name: lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          github_token: ${{ github.token }}
          windows_base_deploy_key: ${{ secrets.WINDOWS_BASE_DEPLOY_KEY }}
          provision_windows_security_deploy_key: ${{ secrets.PROVISION_WINDOWS_SECURITY_DEPLOY_KEY }}

      - name: Run Validation
        run: |
          source venv/bin/activate
          make check

  integration:
    name: Integration Tests
    needs: lint
    runs-on: [self-hosted, macOS, ARM64]
    # Guard: Only run on trusted PRs/pushes/dispatches
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          github_token: ${{ github.token }}
          windows_base_deploy_key: ${{ secrets.WINDOWS_BASE_DEPLOY_KEY }}
          provision_windows_security_deploy_key: ${{ secrets.PROVISION_WINDOWS_SECURITY_DEPLOY_KEY }}

      - name: Azure Integration (Deferred)
        if: false # TODO: Re-enable when ACG TAP model stabilizes
        run: |
          source venv/bin/activate
          make test-azure-provision-tomcat

      - name: AWS Integration (Deferred)
        if: false # TODO: Re-enable when AWS sandbox is active
        run: |
          source venv/bin/activate
          make test-aws-provision-tomcat

      - name: Vagrant Integration
        env:
          OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
          VAGRANT_IGNORE_WINRM_PLUGIN: "YES"
        run: |
          source venv/bin/activate
          make test-win11
          make test-upgrade-win11

      - name: Mandatory Cleanup
        if: always()
        run: |
          source venv/bin/activate || true
          make vagrant-destroy || true
