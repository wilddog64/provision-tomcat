name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  kitchen-test:
    # Security: Only run on trusted PRs/pushes (No Forks)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    env:
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES
    steps:
      - name: Checkout provision-tomcat
        uses: actions/checkout@v4

      - name: Checkout provision-java
        uses: actions/checkout@v4
        with:
          repository: wilddog64/provision-java
          path: roles/provision-java

      - name: Install SSH Keys and Config
        run: |
          mkdir -p ~/.ssh
          
          # Write Key 1
          echo "${{ secrets.WINDOWS_BASE_DEPLOY_KEY }}" > ~/.ssh/id_windows_base
          chmod 600 ~/.ssh/id_windows_base
          
          # Write Key 2
          echo "${{ secrets.PROVISION_WINDOWS_SECURITY_DEPLOY_KEY }}" > ~/.ssh/id_provision_security
          chmod 600 ~/.ssh/id_provision_security
          
          # Create Config with Aliases
          cat <<EOF > ~/.ssh/config
          Host windows-base-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_windows_base
            IdentitiesOnly yes
          
          Host provision-security-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_provision_security
            IdentitiesOnly yes
          EOF
          
          # Add GitHub to known_hosts
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh

      - name: Checkout windows-base
        run: git clone windows-base-repo:wilddog64/windows-base.git roles/windows-base

      - name: Checkout provision-windows-security
        run: git clone provision-security-repo:wilddog64/provision-windows-security.git roles/provision-windows-security

      - name: Install Dependencies
        run: |
          # Set up Python venv for Ansible
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          
          # Set up Ruby bundle for Kitchen
          bundle config set --local path 'vendor/bundle'
          bundle install
          
          # Run deps with correct path
          export PATH=$PWD/.venv/bin:$PATH
          # Note: We skip 'make deps' because we manually checked out roles above to handle SSH aliases
          ln -s . roles/provision-tomcat

      - name: Run Test (Upgrade Win11)
        run: |
          source .venv/bin/activate
          bundle exec make test-upgrade-win11
