---
provisioner:
  require_chef_omnibus: false
  name: ansible_playbook
  hosts: test-kitchen
  require_ansible_repo: true
  playbook: tests/playbook.yml
  roles_path: ./roles:..
  ansible_version: latest
  host_key_checking: false
  ansible_galaxy_role_file: requirements.yml
  # vault_password_file: ./secrets/my_pass.txt
  idempotency_test: false
  chef_bootstrap_url: null
  verbose: vv
  extra_vars:
    env: stage2
    extract_build_number: 16
    extract_debug: 'False'
    skip_migration: true

platforms:
  - name: ubuntu-2404
    driver:
      name: vagrant
      driver: virtualbox
      vagrant_binary: <%= File.join(File.dirname(__FILE__), 'bin', 'vagrant-wrapper') %>
    driver_config:
      box: hashicorp-education/ubuntu-24-04
  - name: rockylinux9
    driver:
      name: vagrant
      driver: virtualbox
      vagrant_binary: <%= File.join(File.dirname(__FILE__), 'bin', 'vagrant-wrapper') %>
    driver_config:
      box: bento/rockylinux-9
  - name: win11
    driver:
      name: vagrant
      driver: virtualbox
      vagrant_binary: <%= File.join(File.dirname(__FILE__), 'bin', 'vagrant-wrapper') %>
    driver_config:
      box: stromweld/windows-11
      communicator: winrm
    transport:
      name: winrm
      elevated: true
      ssl_peer_verification: false
      port: 5985
      winrm_transport: :plaintext
      ssl: false
      connection_retries: 5
      connection_retry_sleep: 10
    provisioner:
      name: ansible_push
      ansible_playbook_bin: <%= Dir.glob("#{File.dirname(File.dirname(__FILE__))}/.direnv/python-*/bin/ansible-playbook").first || Dir.glob("#{Dir.pwd}/.direnv/python-*/bin/ansible-playbook").first %>
      hosts: test-kitchen
      require_ansible_repo: true
      playbook: tests/playbook.yml
      roles_path: ./roles:..
      ansible_version: latest
      ansible_host_key_checking: false
      ansible_galaxy_role_file: requirements.yml
      idempotency_test: false
      chef_bootstrap_url: null
      ansible_verbosity: 2
      require_windows_support: true
      extra_vars:
        env: stage2
        extract_build_number: 16
        extract_debug: 'False'
        skip_migration: true
        ansible_connection: winrm
        ansible_winrm_transport: basic
        ansible_port: 55985
        ansible_winrm_scheme: http
        ansible_winrm_server_cert_validation: ignore
        ansible_user: vagrant
        ansible_password: vagrant
        ansible_host: 127.0.0.1
  - name: win11-disk
    driver:
      name: vagrant
      driver: virtualbox
      vagrant_binary: <%= File.join(File.dirname(__FILE__), 'bin', 'vagrant-wrapper') %>
      provision: true  # Run Vagrant provisioners (disk_setup) during kitchen create
    driver_config:
      box: stromweld/windows-11
      communicator: winrm
      vagrantfiles:
        - /Users/cliang/src/gitrepo/personal/ansible/provision-tomcat/vagrant/Vagrantfile-disk.rb
    transport:
      name: winrm
      elevated: true
      ssl_peer_verification: false
      port: 5985
      winrm_transport: :plaintext
      ssl: false
      connection_retries: 5
      connection_retry_sleep: 10
    provisioner:
      name: ansible_push
      ansible_playbook_bin: <%= Dir.glob("#{File.dirname(File.dirname(__FILE__))}/.direnv/python-*/bin/ansible-playbook").first || Dir.glob("#{Dir.pwd}/.direnv/python-*/bin/ansible-playbook").first %>
      hosts: test-kitchen
      require_ansible_repo: true
      playbook: tests/playbook.yml
      roles_path: ./roles:..
      ansible_version: latest
      ansible_host_key_checking: false
      ansible_galaxy_role_file: requirements.yml
      idempotency_test: false
      chef_bootstrap_url: null
      ansible_verbosity: 2
      require_windows_support: true
      extra_vars:
        env: stage2
        extract_build_number: 16
        extract_debug: 'False'
        skip_migration: true
        ansible_connection: winrm
        ansible_winrm_transport: basic
        ansible_port: 55985
        ansible_winrm_scheme: http
        ansible_winrm_server_cert_validation: ignore
        ansible_user: vagrant
        ansible_password: vagrant
        ansible_host: 127.0.0.1
        install_drive: "D:"

  - name: win11-baseline
    driver:
      name: vagrant
      driver: virtualbox
      vagrant_binary: <%= File.join(File.dirname(__FILE__), 'bin', 'vagrant-wrapper') %>
    driver_config:
      box: windows11-tomcat112
      communicator: winrm
    transport:
      name: winrm
      elevated: true
      ssl_peer_verification: false
      port: 5985
      winrm_transport: :plaintext
      ssl: false
      connection_retries: 5
      connection_retry_sleep: 10
    provisioner:
      name: ansible_push
      ansible_playbook_bin: <%= Dir.glob("#{File.dirname(File.dirname(__FILE__))}/.direnv/python-*/bin/ansible-playbook").first || Dir.glob("#{Dir.pwd}/.direnv/python-*/bin/ansible-playbook").first %>
      hosts: test-kitchen
      require_ansible_repo: true
      playbook: tests/playbook.yml
      roles_path: ..
      ansible_version: latest
      ansible_host_key_checking: false
      ansible_galaxy_role_file: requirements.yml
      idempotency_test: false
      chef_bootstrap_url: null
      ansible_verbosity: 2
      require_windows_support: true
      extra_vars:
        env: stage2
        extract_build_number: 16
        extract_debug: 'False'
        skip_migration: true
        ansible_connection: winrm
        ansible_winrm_transport: basic
        ansible_port: 55985
        ansible_winrm_scheme: http
        ansible_winrm_server_cert_validation: ignore
        ansible_user: vagrant
        ansible_password: vagrant
        ansible_host: 127.0.0.1

  - name: aws-minimal-win
    driver:
      name: ec2
      region: us-east-1
      availability_zone: us-east-1c
      instance_type: t3.micro
      associate_public_ip: true
      subnet_id: subnet-0954882beb2992ab6
      security_group_ids: ["sg-01cf462be702fd37c"]
      image_id: ami-06f5f29d1fe41ea03
    transport:
      name: winrm
      elevated: true
      username: Administrator
      winrm_transport: :negotiate
    provisioner:
      name: ansible_push
      ansible_install_mode: :skip
      pass_transport_password: true
      generate_inv: true
      use_instance_name: false
      ansible_playbook_bin: <%= Dir.glob("#{File.dirname(File.dirname(__FILE__))}/.direnv/python-*/bin/ansible-playbook").first || Dir.glob("#{Dir.pwd}/.direnv/python-*/bin/ansible-playbook").first %>
      require_ansible_repo: true
      playbook: tests/playbook.yml
      roles_path: ..
      ansible_version: latest
      ansible_host_key_checking: false
      ansible_galaxy_role_file: requirements.yml
      idempotency_test: false
      chef_bootstrap_url: null
      ansible_verbosity: 2
      require_windows_support: true
      extra_vars:
        env: stage2
        extract_build_number: 16
        extract_debug: 'False'
        skip_migration: true
        ansible_connection: winrm
        ansible_winrm_transport: ntlm
        ansible_winrm_scheme: http
        ansible_winrm_server_cert_validation: ignore
        ansible_user: Administrator
        ansible_become_method: runas
        ansible_become_user: Administrator
        ansible_port: 5985

suites:
  - name: default
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      extra_vars:
        tomcat_version: "9.0.113"
        tomcat_auto_start: true
    verifier:
      name: shell
      command: |
        # Verify port forwarding is working (Ansible playbook handles service verification)
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"

  - name: upgrade
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      playbook: tests/playbook-upgrade.yml
      extra_vars:
        upgrade_step: 1
        tomcat_auto_start: true
    verifier:
      name: shell
      command: |
        # Verify port forwarding is working
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"

  - name: downgrade
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      playbook: tests/playbook-downgrade.yml
      extra_vars:
        downgrade_step: 1
        tomcat_auto_start: true
    verifier:
      name: shell
      command: |
        # Verify port forwarding is working
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"

  - name: idempotence
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      extra_vars:
        tomcat_version: "9.0.113"
        tomcat_auto_start: true
      idempotency_test: true
    verifier:
      name: shell
      command: |
        # Verify port forwarding is working
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"

  - name: no-autostart
    provisioner:
      extra_vars:
        tomcat_version: "9.0.113"
        tomcat_auto_start: false
    verifier:
      name: shell
      command: |
        # No verification needed - Ansible playbook handles service state checks
        exit 0
  - name: upgrade-baseline
    driver:
      network:
        # Use alternate host ports to avoid local conflicts (similar to provision-jenkins)
        - ["forwarded_port", {guest: 8080, host: 18080, auto_correct: false}]
        - ["forwarded_port", {guest: 9080, host: 19080, auto_correct: false}]
    provisioner:
      playbook: tests/playbook-upgrade.yml
      extra_vars:
        upgrade_step: 2
        tomcat_auto_start: true
        tomcat_candidate_enabled: true
        tomcat_candidate_delegate: localhost
        tomcat_candidate_delegate_host: 127.0.0.1
        tomcat_candidate_delegate_port: 19080
        tomcat_candidate_manual_control: true
    verifier:
      name: shell
      command: |
        set -euo pipefail

        sleep 20

        check_port() {
          local port="$1"
          local attempts="${2:-6}"
          local delay="${3:-10}"

          for attempt in $(seq 1 "$attempts"); do
            echo "Attempt ${attempt}/${attempts}: curl http://localhost:${port}"
            if curl --silent --show-error --connect-timeout 5 --max-time 10 -f "http://localhost:${port}" \
              || curl --silent --show-error --connect-timeout 5 --max-time 10 "http://localhost:${port}" | grep -q "404"; then
              echo "Port ${port} responded successfully."
              return 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Port ${port} not ready yet; sleeping ${delay}s before retrying..."
              sleep "$delay"
            fi
          done

          echo "ERROR: Port ${port} never responded after ${attempts} attempts."
          return 1
        }

        candidate_host_port=19080
        primary_host_port=18080
        ansible_cmd="${KITCHEN_ANSIBLE_PLAYBOOK_BIN:-$(command -v ansible-playbook)}"
        if [ ! -x "$ansible_cmd" ]; then
          echo "ERROR: ansible-playbook binary not found" >&2
          exit 1
        fi
        temp_inventory="$(mktemp)"
        cat <<'EOF' > "$temp_inventory"
        [baseline-win11-baseline]
        baseline-win11 ansible_connection=winrm ansible_host=127.0.0.1 ansible_user=vagrant ansible_password=vagrant ansible_port=55985 ansible_winrm_transport=basic ansible_winrm_scheme=http ansible_winrm_server_cert_validation=ignore
        EOF
        promotion_extra_vars="env=stage2 extract_build_number=16 extract_debug=False skip_migration=true upgrade_step=2 tomcat_auto_start=true tomcat_candidate_enabled=true tomcat_candidate_delegate=localhost tomcat_candidate_delegate_host=127.0.0.1 tomcat_candidate_delegate_port=${candidate_host_port}"

        echo "Checking candidate Tomcat on port ${candidate_host_port} before promotion..."
        check_port "${candidate_host_port}" 20 10

        echo "Promoting candidate via ansible-playbook before primary verification..."
        "$ansible_cmd" tests/playbook-upgrade.yml \
          -i "$temp_inventory" \
          -e "${promotion_extra_vars} tomcat_candidate_manual_control=false"
        rm -f "$temp_inventory"

        echo "Waiting for promoted Tomcat on port ${primary_host_port}..."
        # Give the promotion extra time to restart the primary service.
        check_port "${primary_host_port}" 12 10
