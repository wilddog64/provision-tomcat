suites:
  - name: default
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      extra_vars:
        tomcat_version: "9.0.115"
        tomcat_auto_start: true
    verifier:
      name: shell
      command: |
        # Get hostname from Kitchen state (works for both Vagrant/localhost and AWS public IPs)
        INSTANCE_HOSTNAME=$(yq .hostname .kitchen/default-*.yml)
        if [ "$INSTANCE_HOSTNAME" = "null" ] || [ -z "$INSTANCE_HOSTNAME" ]; then
          INSTANCE_HOSTNAME="localhost"
        fi
        echo "Verifying Tomcat on http://${INSTANCE_HOSTNAME}:8080"
        curl --connect-timeout 5 --max-time 10 -f "http://${INSTANCE_HOSTNAME}:8080" || curl --connect-timeout 5 --max-time 10 "http://${INSTANCE_HOSTNAME}:8080" | grep -q "404"

  - name: upgrade
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      playbook: tests/playbook-upgrade.yml
      extra_vars:
        upgrade_step: 1
        tomcat_auto_start: true
    verifier:
      name: shell
      command: |
        # Verify port forwarding is working
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"

  - name: downgrade
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      playbook: tests/playbook-downgrade.yml
      extra_vars:
        downgrade_step: 1
        tomcat_auto_start: true
    verifier:
      name: shell
      command: |
        # Verify port forwarding is working
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"

  - name: idempotence
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      extra_vars:
        tomcat_version: "9.0.115"
        tomcat_auto_start: true
      idempotency_test: true
    verifier:
      name: shell
      command: |
        # Verify port forwarding is working
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"

  - name: no-autostart
    provisioner:
      extra_vars:
        tomcat_version: "9.0.115"
        tomcat_auto_start: false
    verifier:
      name: shell
      command: |
        # No verification needed - Ansible playbook handles service state checks
        exit 0
  - name: upgrade-baseline
    driver:
      network:
        # Use alternate host ports to avoid local conflicts (similar to provision-jenkins)
        - ["forwarded_port", {guest: 8080, host: 18080, auto_correct: false}]
        - ["forwarded_port", {guest: 9080, host: 19080, auto_correct: false}]
    provisioner:
      playbook: tests/playbook-upgrade.yml
      extra_vars:
        upgrade_step: 2
        tomcat_auto_start: true
        tomcat_candidate_enabled: true
        tomcat_candidate_delegate: localhost
        tomcat_candidate_delegate_host: 127.0.0.1
        tomcat_candidate_delegate_port: 19080
        tomcat_candidate_manual_control: true
    verifier:
      name: shell
      command: |
        set -euo pipefail

        sleep 20

        check_port() {
          local port="$1"
          local attempts="${2:-6}"
          local delay="${3:-10}"

          for attempt in $(seq 1 "$attempts"); do
            echo "Attempt ${attempt}/${attempts}: curl http://localhost:${port}"
            if curl --silent --show-error --connect-timeout 5 --max-time 10 -f "http://localhost:${port}" \
              || curl --silent --show-error --connect-timeout 5 --max-time 10 "http://localhost:${port}" | grep -q "404"; then
              echo "Port ${port} responded successfully."
              return 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Port ${port} not ready yet; sleeping ${delay}s before retrying..."
              sleep "$delay"
            fi
          done

          echo "ERROR: Port ${port} never responded after ${attempts} attempts."
          return 1
        }

        candidate_host_port=19080
        primary_host_port=18080
        ansible_cmd="${KITCHEN_ANSIBLE_PLAYBOOK_BIN:-$(command -v ansible-playbook)}"
        if [ ! -x "$ansible_cmd" ]; then
          echo "ERROR: ansible-playbook binary not found" >&2
          exit 1
        fi
        temp_inventory="$(mktemp)"
        cat <<'EOF' > "$temp_inventory"
        [baseline-win11-baseline]
        baseline-win11 ansible_connection=winrm ansible_host=127.0.0.1 ansible_user=vagrant ansible_password=vagrant ansible_port=55985 ansible_winrm_transport=basic ansible_winrm_scheme=http ansible_winrm_server_cert_validation=ignore
        EOF
        promotion_extra_vars="env=stage2 extract_build_number=16 extract_debug=False skip_migration=true upgrade_step=2 tomcat_auto_start=true tomcat_candidate_enabled=true tomcat_candidate_delegate=localhost tomcat_candidate_delegate_host=127.0.0.1 tomcat_candidate_delegate_port=${candidate_host_port}"

        echo "Checking candidate Tomcat on port ${candidate_host_port} before promotion..."
        check_port "${candidate_host_port}" 20 10

        echo "Promoting candidate via ansible-playbook before primary verification..."
        "$ansible_cmd" tests/playbook-upgrade.yml \
          -i "$temp_inventory" \
          -e "${promotion_extra_vars} tomcat_candidate_manual_control=false"
        rm -f "$temp_inventory"

        echo "Waiting for promoted Tomcat on port ${primary_host_port}..."
        # Give the promotion extra time to restart the primary service.
        check_port "${primary_host_port}" 12 10

  - name: upgrade-candidate-aws
    provisioner:
      playbook: tests/playbook-upgrade.yml
      use_instance_name: false
      generate_inv: true
      ansible_host_key_checking: false
      extra_vars:
        ansible_host: "<%= ENV['ANSIBLE_HOST_OVERRIDE'] %>"
        tomcat_candidate_delegate_host: "<%= ENV['ANSIBLE_HOST_OVERRIDE'] %>"
        upgrade_step: 2
        tomcat_auto_start: true
        tomcat_candidate_enabled: true
        tomcat_candidate_delegate: localhost
        tomcat_candidate_delegate_port: 9080
        tomcat_candidate_manual_control: true
    verifier:
      name: shell
      command: |
        # In AWS, we verify against the dynamic hostname
        INSTANCE_HOSTNAME=$(yq .hostname .kitchen/upgrade-candidate-aws-aws-minimal-win.yml)
        echo "Verifying candidate on http://${INSTANCE_HOSTNAME}:9080"
        curl --connect-timeout 5 --max-time 10 -f "http://${INSTANCE_HOSTNAME}:9080" || curl --connect-timeout 5 --max-time 10 "http://${INSTANCE_HOSTNAME}:9080" | grep -q "404"

  - name: upgrade-candidate-aws-disk
    provisioner:
      playbook: tests/playbook-upgrade.yml
      use_instance_name: false
      generate_inv: true
      ansible_host_key_checking: false
      extra_vars:
        ansible_host: "<%= ENV['ANSIBLE_HOST_OVERRIDE'] %>"
        tomcat_candidate_delegate_host: "<%= ENV['ANSIBLE_HOST_OVERRIDE'] %>"
        upgrade_step: 2
        tomcat_auto_start: true
        tomcat_candidate_enabled: true
        tomcat_candidate_delegate: localhost
        tomcat_candidate_delegate_port: 9080
        tomcat_candidate_manual_control: true
        install_drive: "D:"
    verifier:
      name: shell
      command: |
        # In AWS, we verify against the dynamic hostname
        INSTANCE_HOSTNAME=$(yq .hostname .kitchen/upgrade-candidate-aws-disk-aws-minimal-win-disk.yml)
        echo "Verifying candidate on http://${INSTANCE_HOSTNAME}:9080"
        curl --connect-timeout 5 --max-time 10 -f "http://${INSTANCE_HOSTNAME}:9080" || curl --connect-timeout 5 --max-time 10 "http://${INSTANCE_HOSTNAME}:9080" | grep -q "404"
