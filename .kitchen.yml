<%
azure_env_file = ENV['AZURE_ENV_FILE'] || File.expand_path('scratch/azure-sandbox.env', __dir__)
if File.exist?(azure_env_file)
  File.foreach(azure_env_file) do |line|
    next unless line.start_with?('export ')
    key, value = line.sub('export ', '').split('=', 2)
    next unless key && value
    value = value.strip
    if (value.start_with?("'") && value.end_with?("'")) || (value.start_with?('"') && value.end_with?('"'))
      value = value[1...-1]
    end
    ENV[key] ||= value
  end
end
%>
---
driver:
  name: vagrant

.common_vagrant: &common_vagrant
  name: vagrant
  driver: virtualbox
  vagrant_binary: <%= File.join(File.dirname(__FILE__), 'bin', 'vagrant-wrapper') %>

provisioner:
  require_chef_omnibus: false
  name: ansible_playbook
  hosts: test-kitchen
  require_ansible_repo: true
  playbook: tests/playbook.yml
  roles_path: ./roles:..
  ansible_version: latest
  host_key_checking: false
  ansible_galaxy_role_file: requirements.yml
  # vault_password_file: ./secrets/my_pass.txt
  idempotency_test: <%= ENV.fetch('KITCHEN_IDEMPOTENCE', 'false') == 'true' %>
  chef_bootstrap_url: null
  verbose: vv
  extra_vars:
    env: stage2
    extract_build_number: 16
    extract_debug: 'False'
    skip_migration: true

platforms:
  - name: ubuntu-2404
    driver:
      <<: *common_vagrant
    driver_config:
      box: hashicorp-education/ubuntu-24-04
  - name: rockylinux9
    driver:
      <<: *common_vagrant
    driver_config:
      box: bento/rockylinux-9
  - name: win11
    driver:
      <<: *common_vagrant
    driver_config:
      box: stromweld/windows-11
      communicator: winrm
      customize:
        memory: 8192
        cpus: 4
    transport:
      name: winrm
      elevated: true
      ssl_peer_verification: false
      port: 5985
      winrm_transport: :plaintext
      ssl: false
      connection_retries: 15
      connection_retry_sleep: 20
      operation_timeout: 600
    provisioner:
      name: ansible_push
      ansible_playbook_bin: <%= Dir.glob("#{Dir.pwd}/venv/bin/ansible-playbook").first || Dir.glob("#{File.dirname(File.dirname(__FILE__))}/.direnv/python-*/bin/ansible-playbook").first || Dir.glob("#{Dir.pwd}/.direnv/python-*/bin/ansible-playbook").first || "ansible-playbook" %>
      hosts: test-kitchen
      require_ansible_repo: true
      playbook: tests/playbook.yml
      roles_path: ./roles:..
      ansible_version: latest
      ansible_host_key_checking: false
