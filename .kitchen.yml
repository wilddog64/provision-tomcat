  - name: win11-azure
    driver:
      name: azurerm
      subscription_id: <%= ENV.fetch('AZURE_SUBSCRIPTION_ID', '28e1e42a-4438-4c30-9a5f-7d7b488fd883') %>
      tenant_id: <%= ENV.fetch('AZURE_TENANT_ID', '84f1e4ea-8554-43e1-8709-f0b8589ea118') %>
      use_cli_credentials: true
      use_managed_identity: false
      location: southcentralus
      explicit_resource_group_name: "1-6057ce5e-playground-sandbox"
      allow_resource_group_creation: false
      delete_resource_group: false
      destroy_explicit_resource_group: false
      vm_name: <%= ENV.fetch('AZURE_VM_NAME', 'kqvm-win11') %>
      vm_size: <%= ENV.fetch('AZURE_VM_SIZE', 'Standard_DS1_v2') %>
      image_urn: <%= ENV.fetch('AZURE_IMAGE_URN', 'MicrosoftWindowsServer:WindowsServer:2022-datacenter-g2:latest') %>
      storage_account_type: <%= ENV.fetch('AZURE_STORAGE_SKU', 'StandardSSD_LRS') %>
      os_disk_size_gb: <%= ENV.fetch('AZURE_OS_DISK_GB', '64') %>
      public_ip_sku: Standard
      <% if ENV['AZURE_VNET_NAME'].to_s.strip != '' %>
      virtual_network_name: <%= ENV['AZURE_VNET_NAME'] %>
      subnet_name: <%= ENV['AZURE_SUBNET_NAME'] %>
      <% end %>
      <% if ENV['AZURE_NSG_NAME'].to_s.strip != '' %>
      security_group_name: <%= ENV['AZURE_NSG_NAME'] %>
      <% end %>
      winrm_powershell_script: |
        winrm quickconfig -q
        winrm set winrm/config/service/Auth @{Basic="true"}
        winrm set winrm/config/service @{AllowUnencrypted="true"}
        netsh advfirewall firewall add rule name="WinRM5985" dir=in action=allow protocol=TCP localport=5985
        netsh advfirewall firewall add rule name="HTTP8080" dir=in action=allow protocol=TCP localport=8080
        netsh advfirewall firewall add rule name="HTTP9080" dir=in action=allow protocol=TCP localport=9080
    transport:
      name: winrm
      elevated: true
      ssl_peer_verification: false
      port: 5985
      winrm_transport: :plaintext
      ssl: false
      connection_retries: 15
      connection_retry_sleep: 10
      operation_timeout: 600
      username: <%= ENV.fetch('AZURE_ADMIN_USERNAME', 'azureadmin') %>
      password: <%= ENV.fetch('AZURE_ADMIN_PASSWORD', 'ChangeM3!') %>
    provisioner:
      name: ansible_push
      ansible_playbook_bin: <%= Dir.glob("#{Dir.pwd}/.direnv/python-*/bin/ansible-playbook").first || "ansible-playbook" %>
      hosts: test-kitchen
      require_ansible_repo: true
      playbook: tests/playbook.yml
      roles_path: ..
      ansible_version: latest
      ansible_host_key_checking: false
      ansible_galaxy_role_file: requirements.yml
      idempotency_test: false
      chef_bootstrap_url: null
      ansible_verbosity: 2
      require_windows_support: true
      extra_vars:
        env: stage2
        extract_build_number: 16
        extract_debug: 'False'
        skip_migration: true
        ansible_connection: winrm
        ansible_winrm_transport: basic
        ansible_port: 5985
        ansible_winrm_scheme: http
        ansible_winrm_server_cert_validation: ignore
        ansible_user: <%= ENV.fetch('AZURE_ADMIN_USERNAME', 'azureadmin') %>
        ansible_password: <%= ENV.fetch('AZURE_ADMIN_PASSWORD', 'ChangeM3!') %>
        ansible_become_method: runas
        ansible_become_user: <%= ENV.fetch('AZURE_ADMIN_USERNAME', 'azureadmin') %>

suites:
  - name: default
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      extra_vars:
        tomcat_version: "9.0.113"
        tomcat_auto_start: true
    verifier:
      name: shell
      command: |
        # Verify port forwarding is working (Ansible playbook handles service verification)
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"

  - name: upgrade
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      playbook: tests/playbook-upgrade.yml
      extra_vars:
        upgrade_step: 1
        tomcat_auto_start: true
    verifier:
      name: shell
      command: |
        # Verify port forwarding is working
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"

  - name: downgrade
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      playbook: tests/playbook-downgrade.yml
      extra_vars:
        downgrade_step: 1
        tomcat_auto_start: true
    verifier:
      name: shell
      command: |
        # Verify port forwarding is working
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"

  - name: idempotence
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
    provisioner:
      extra_vars:
        tomcat_version: "9.0.113"
        tomcat_auto_start: true
      idempotency_test: true
    verifier:
      name: shell
      command: |
        # Verify port forwarding is working
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"

  - name: no-autostart
    provisioner:
      extra_vars:
        tomcat_version: "9.0.113"
        tomcat_auto_start: false
    verifier:
      name: shell
      command: |
        # No verification needed - Ansible playbook handles service state checks
        exit 0
  - name: upgrade-baseline
    driver:
      network:
        - ["forwarded_port", {guest: 8080, host: 8080, auto_correct: true}]
        - ["forwarded_port", {guest: 9080, host: 9080, auto_correct: true}]
    provisioner:
      playbook: tests/playbook-upgrade.yml
      extra_vars:
        upgrade_step: 2
        tomcat_auto_start: true
        tomcat_candidate_enabled: true
        tomcat_candidate_delegate: localhost
    verifier:
      name: shell
      command: |
        curl --connect-timeout 5 --max-time 10 -f http://localhost:8080 || curl --connect-timeout 5 --max-time 10 http://localhost:8080 | grep -q "404"
