[defaults]
forks = 1
roles_path = ../
collections_path = ./collections
interpreter_python = /usr/bin/python3
stdout_callback = default
bin_ansible_callbacks = True
result_format = yaml

[ssh_connection]

pipelining = True



[winrm_connection]
# WARNING: Using WinRM with 'basic' authentication over HTTP sends credentials base64-encoded,
# which is effectively plaintext. This configuration with AllowUnencrypted = true is ONLY
# acceptable for temporary sandbox VMs in isolated test environments.
# For production or non-sandbox usage, configure WinRM over HTTPS with proper certificates
# and keep AllowUnencrypted disabled.
read_timeout_sec = 600

operation_timeout_sec = 540

connection_retries = 15

ansible_winrm_transport = basic
