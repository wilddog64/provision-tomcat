[defaults]
roles_path = ./roles:../
collections_path = ./collections
interpreter_python = /usr/bin/python3
stdout_callback = default
bin_ansible_callbacks = True
result_format = yaml

[ssh_connection]
pipelining = True

[winrm_connection]
# WARNING: Using WinRM with 'basic' authentication sends credentials base64-encoded and
# therefore effectively in plaintext when used over HTTP or with AllowUnencrypted = true.
# This may be acceptable only for temporary sandbox VMs. For any non-sandbox or production
# usage, configure WinRM over HTTPS with proper certificates and keep AllowUnencrypted disabled.
read_timeout_sec = 600
operation_timeout_sec = 540
connection_retries = 15
ansible_winrm_transport = basic
