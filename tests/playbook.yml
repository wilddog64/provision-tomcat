---
- hosts: all
  become: yes
  gather_facts: no
  vars:
    jdk_version: 21
    # Install paths - override with -e install_drive=D: to use D: drive
    install_drive: "C:"
    java_install_base_dir: "{{ install_drive }}/java"
    tomcat_install_dir: "{{ install_drive }}/Tomcat"
    java_temp_dir: "{{ install_drive }}/temp"
    tomcat_temp_dir: "{{ install_drive }}/temp"
    # Test account password - override with -e test_account_password=YourPassword or TEST_ACCOUNT_PASSWORD env var
    # WARNING: The default password is only suitable for ephemeral test environments and should be overridden
    # for any environment that persists beyond a single test run.
    test_account_password: "{{ lookup('env', 'TEST_ACCOUNT_PASSWORD') | default('TestP@ssw0rd123!', true) }}"

    # Security account overrides for testing (uses local accounts)
    security_service_account: "svcTomcat"
    security_jenkins_accounts:
      - "svclabbuild"
      - "svcjenkins"

  pre_tasks:
    - name: Wait for connection to be stable
      ansible.builtin.wait_for_connection:
        timeout: 300
      become: no

    - name: Gather facts
      ansible.builtin.setup:
      become: no

    - name: Create local test accounts
      ansible.windows.win_user:
        name: "{{ item }}"
        password: "{{ test_account_password }}"
        password_never_expires: true
        state: present
        groups:
          - Users
      loop:
        - svcTomcat
        - svclabbuild
        - svcjenkins
      when: ansible_facts['os_family'] == 'Windows'
      become: no

  roles:
    - windows-base
    - provision-windows-security
    - provision-java
    - provision-tomcat

# Note: Host-side verification is handled by Kitchen verifier
# For Vagrant, Tomcat accessibility is verified inside the VM
# You can manually test with: curl http://localhost:8080
