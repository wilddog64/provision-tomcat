---
- hosts: all
  become: yes
  gather_facts: no
  vars:
    jdk_version: 21
    # Install paths - override with -e install_drive=D: to use D: drive
    install_drive: "D:"
    java_install_base_dir: "{{ install_drive }}/java"
    tomcat_install_dir: "{{ install_drive }}/Tomcat"
    java_temp_dir: "{{ install_drive }}/temp"
    tomcat_temp_dir: "{{ install_drive }}/temp"

    # Security account overrides for testing (uses local accounts)
    security_service_account: "svcTomcat"
    security_jenkins_accounts:
      - "svclabbuild"
      - "svcjenkins"

  pre_tasks:
    - name: Wait for connection to be stable
      ansible.builtin.wait_for_connection:
        timeout: 300
      become: no

    - name: Gather facts
      ansible.builtin.setup:
      become: no

    - name: "Initialize and format D: drive (AWS/Vagrant)"
      ansible.windows.win_shell: |
        $disk = Get-Disk | Where-Object PartitionStyle -eq 'RAW'
        if ($disk) {
          $disk | Initialize-Disk -PartitionStyle GPT -PassThru |
            New-Partition -DriveLetter D -UseMaximumSize |
            Format-Volume -FileSystem NTFS -NewFileSystemLabel "Data" -Confirm:$false
          return "D: drive initialized"
        }
        return "No RAW disk found or D: drive already exists"
      when: 
        - ansible_facts['os_family'] == 'Windows'
        - install_drive == "D:"
      register: disk_init_output
      changed_when: "'initialized' in disk_init_output.stdout"
      become: no

    - name: Create local test accounts
      ansible.windows.win_user:
        name: "{{ item }}"
        password: "{{ tomcat_test_password | default('Password123!') }}"
        password_never_expires: true
        state: present
        groups:
          - Users
      loop:
        - svcTomcat
        - svclabbuild
        - svcjenkins
      when: ansible_facts['os_family'] == 'Windows'
      become: no
      no_log: true

  roles:
    - windows-base
    - provision-windows-security
    - provision-java
    - provision-tomcat

# Note: Host-side verification is handled by Kitchen verifier
# For Vagrant, Tomcat accessibility is verified inside the VM
# You can manually test with: curl http://localhost:8080
